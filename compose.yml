services:
  traefik:
    image: traefik:v3.7
    container_name: jhub-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--api.insecure=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=:8443"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--accesslog=true"
      - "--accesslog.format=json"
    ports:
      - "127.0.0.1:8000:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    networks:
      - jupyterhub_net

  jupyterhub:
    image: jupyterhub-scientific-hub:0.1.0
    container_name: jhub
    restart: unless-stopped
    command: jupyterhub -f /etc/jupyterhub/jupyterhub_config.py
    environment:
      JUPYTERHUB_USERS_DIR: ${JUPYTERHUB_USERS_DIR:-/srv/jupyterhub/users}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${JUPYTERHUB_HUB_DIR:-/srv/jupyterhub/hub}:/srv/jupyterhub/hub
      - ${JUPYTERHUB_USERS_DIR:-/srv/jupyterhub/users}:/srv/jupyterhub/users
      - ./jupyterhub/jupyterhub_config.py:/etc/jupyterhub/jupyterhub_config.py:ro
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 200
    networks:
      - jupyterhub_net

networks:
  jupyterhub_net:
    name: jupyterhub_net
